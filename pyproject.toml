[project]
name = "shop-broken-tdd"
version = "0.1.0"
description = "Учебный репозиторий: форматтеры, линтеры, CI, TDD и LLM-агенты"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "C90"]
# E501 не нужен: длину строк контролирует ruff format.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Порог сложности. Валидация заказа в части 2 содержит 10 правил,
# поэтому функции с большим числом ветвлений стоит разбивать на помощники.
max-complexity = 9

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Любое предупреждение Python считаем ошибкой: так «красный» тест выглядит громко.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["shop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
